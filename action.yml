name: Setup Utoo
description: Download, install, and setup Utoo to your path.
author: utooland

branding:
  icon: package
  color: purple

inputs:
  utoo-version:
    description: The version of Utoo to install. (e.g. "latest", "1.0.0", "1.0.x")
    required: false
    default: latest
  registry:
    description: The URL of the npm registry to use for installing Utoo.
    required: false
    default: https://registry.npmjs.org
  cache-store:
    required: false
    type: boolean
    default: false
    description: Cache npm store directory (~/.cache/nm) for faster package installations.
  cache-utoo:
    required: false
    type: boolean
    default: true
    description: Cache installed Utoo commands to avoid reinstallation on subsequent runs.

outputs:
  utoo-version:
    description: The version of Utoo that was installed.
  utoo-path:
    description: The command path added to PATH.
  cache-hit:
    description: Whether Utoo was restored from cache.

runs:
  using: "node20"
  main: "dist/setup/index.js"
  post: "dist/cache-save/index.js"
  post-if: success()
