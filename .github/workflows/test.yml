name: Test setup-utoo action

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        cache-config:
          - { cache-store: true }
          - { cache-store: true }
          - { cache-store: false }
          - { cache-store: false }

    steps:
      - uses: actions/checkout@v7

      - name: Setup Utoo
        uses: ./
        with:
          utoo-version: "latest"
          cache-store: ${{ matrix.cache-config.cache-store }}

      - name: Verify installation
        run: utoo --version

      - name: Locate installation
        if: runner.os != 'Windows'
        run: which utoo

      - name: Locate installation (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Get-Command utoo

      - name: Test basic commands
        run: |
          utoo --help

  windows-cache-restore:
    runs-on: windows-latest
    needs: test

    steps:
      - uses: actions/checkout@v7

      - name: Restore Utoo
        id: setup-utoo
        uses: ./
        with:
          utoo-version: "latest"

      - name: Verify cache hit
        shell: pwsh
        run: |
          if ("${{ steps.setup-utoo.outputs.cache-hit }}" -ne "true") {
            throw "Expected the Windows Utoo cache to be restored"
          }
          utoo --version
